[project]
name = "baseball-mental-server"
version = "0.1.0"
description = "Game data API and collection workers for Baseball Mental"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "beanie>=2,<3", "pydantic-settings>=2,<3", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires TEST_MONGODB_URI pointing to a test MongoDB"]

[tool.ruff]
target-version = "py313"
line-length = 100
