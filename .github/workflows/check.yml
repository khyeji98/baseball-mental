name: Validate monorepo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run export
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python export_openapi.py
      - run: uv export --no-dev --no-emit-project --no-header --format requirements-txt --output-file requirements.txt
      - run: git diff --exit-code -- ../../contracts/openapi.json requirements.txt
      - run: docker build -t baseball-mental-api .
