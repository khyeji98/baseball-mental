# Local development only. Not a production or externally exposed MongoDB configuration.
services:
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ../apps/server
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: baseball_mental
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
